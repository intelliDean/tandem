name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Foundry Contracts & Fork Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.5.1"
          cache: false

      - name: Verify Foundry installation
        run: |
          forge --version
          cast --version

      - name: Build smart contracts
        run: forge build

      - name: Restore RPC Fork Cache
        run: |
          mkdir -p ~/.foundry/cache/rpc
          tar -xzf test/fixtures/rpc-cache-143.tar.gz -C ~/.foundry/cache/rpc
          cd ~/.foundry/cache/rpc
          ln -sf 143 monad
          ln -sf 143 monad-mainnet
          mkdir -p ~/.cache/foundry
          ln -sf ~/.foundry/cache/rpc ~/.cache/foundry/rpc
          ls -la ~/.foundry/cache/rpc/143 | head -n 5

      - name: Run Foundry unit & fork tests (Pinned Monad Block 109312895)
        run: |
          set -o pipefail
          if ! forge test --fork-url https://rpc.monad.xyz --fork-block-number 109312895 --fork-retries 10 --fork-retry-backoff 3 -vv 2>&1 | tee test-output.log; then
            MSG=$(head -n 25 test-output.log | tr '\r\n' '  ' | sed 's/"/\\"/g' | cut -c 1-2000)
            echo "::error title=Forge Failure::$MSG"
            exit 1
          fi

  typescript:
    name: TypeScript Build & Monorepo Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm v9
        run: npm install -g pnpm@9

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages (@tandem/sdk, @tandem/executor, @tandem/web)
        run: pnpm build

  docker:
    name: Docker Containerization Build
    runs-on: ubuntu-latest
    needs: [contracts, typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm v9
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace bundles for container packaging
        run: pnpm build

      - name: Build Docker Compose images
        run: docker compose build
